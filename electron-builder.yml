appId: com.leqora.animedesk
productName: AnimeDesk
copyright: "© 2026 Leqora"
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bridges
    to: bridges
  - from: docs/releases
    to: releases
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: AnimeDesk-Setup-${version}.exe
publish:
  provider: github
  owner: leqora
  repo: AnimeDesk
